name: Codex Workspace Review
description: Review a filtered pull request from its checked-out merge workspace

inputs:
  openai-api-key:
    description: OpenAI API key for Codex
    required: true

outputs:
  reviewable:
    description: Whether there are reviewable changes within the configured limits
    value: ${{ steps.scope.outputs.reviewable }}
  skip-reason:
    description: Why the review was skipped
    value: ${{ steps.scope.outputs.skip-reason }}
  candidate-count:
    description: Number of reviewable changed files
    value: ${{ steps.scope.outputs.candidate-count }}
  changed-lines:
    description: Number of changed lines in reviewable files
    value: ${{ steps.scope.outputs.changed-lines }}
  codex-outcome:
    description: Outcome of the Codex review step
    value: ${{ steps.codex.outcome }}
  prompt-file:
    description: Path to the generated Codex review prompt
    value: ${{ steps.review-files.outputs.prompt-file }}
  review-file:
    description: Path where Codex should write its review
    value: ${{ steps.review-files.outputs.review-file }}

runs:
  using: composite
  steps:
    - name: Create review manifest
      id: scope
      shell: bash
      run: node "${{ github.action_path }}/scope.mjs"

    - name: Prepare review files
      id: review-files
      if: always()
      shell: bash
      run: |
        prompt_file="${RUNNER_TEMP}/codex-review-workspace-prompt.md"
        review_file="${RUNNER_TEMP}/codex-review-workspace.md"
        node "${{ github.action_path }}/prompt.mjs" "$prompt_file"
        echo "prompt-file=$prompt_file" >> "$GITHUB_OUTPUT"
        echo "review-file=$review_file" >> "$GITHUB_OUTPUT"

    - name: Run Codex review
      id: codex
      if: steps.scope.outputs.reviewable == 'true'
      continue-on-error: true
      uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11; v1.12 can hang after final output
      env:
        RUST_LOG: info
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        model: gpt-5.3-codex
        effort: high
        sandbox: read-only
        prompt-file: ${{ steps.review-files.outputs.prompt-file }}
        output-file: ${{ steps.review-files.outputs.review-file }}

    - name: Log Codex review completion
      if: always() && steps.scope.outputs.reviewable == 'true'
      shell: bash
      env:
        CODEX_OUTCOME: ${{ steps.codex.outcome }}
        REVIEW_FILE: ${{ steps.review-files.outputs.review-file }}
      run: |
        echo "Codex action finished with outcome: $CODEX_OUTCOME"
        if [[ -f "$REVIEW_FILE" ]]; then
          wc -c "$REVIEW_FILE"
        else
          echo "Codex review output file is missing: $REVIEW_FILE"
        fi
